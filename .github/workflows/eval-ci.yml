name: Agent Eval CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (including pytest dev tools)
        run: |
          uv venv --python 3.12
          uv pip install --only-binary cryptography -e ".[dev]"

      - name: Run ADK AgentEvaluator Pytest Gate
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "0"
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: .venv/bin/pytest tests/test_evals.py -v -s
